apiVersion: 1

groups:
  - orgId: 1
    name: crypto-streaming-operations
    folder: Crypto Streaming
    interval: 1m
    rules:
      - uid: crypto-gold-data-stale
        title: Crypto Gold pipeline data is stale
        condition: B
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: ClickHouse
            model:
              database: default
              format: 1
              query: "SELECT toUnixTimestamp(now()) * 1000 AS time, coalesce(toUnixTimestamp(now()) - toUnixTimestamp(max(window_start)), 999999) AS value FROM gold_crypto_analytics_v2 FINAL"
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: threshold
              refId: B
              expression: A
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [300]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                    params: []
        noDataState: Alerting
        execErrState: Error
        for: 2m
        annotations:
          summary: "Gold không có dữ liệu mới trong hơn năm phút"
          runbook_url: "https://github.com/D121104/realtime-stream-crypto/blob/develop/docs/p0-data-recovery-runbook.md"
        labels:
          service: crypto-streaming
          component: gold-pipeline
          severity: critical
